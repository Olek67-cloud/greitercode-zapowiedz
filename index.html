<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>GREITERCODE - startujemy 10.11.2026!</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #000;
    color: #fff;
    font-family: "Open Sans", "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(28px, 7vh, 80px);
    width: 100%;
  }
  h1, p { margin: 0; font-weight: 400; line-height: 1.2; }

  /* GREITERCODE! */
  .nazwa {
    color: #00c060;
    font-size: clamp(40px, 7.4vw, 104px);
  }

  /* Startujemy 10.11.2026! */
  .data {
    font-size: clamp(30px, 5.6vw, 80px);
    background: linear-gradient(90deg, #0095b0, #72d95a);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    margin-top: calc(clamp(28px, 7vh, 80px) * -0.6);
  }

  /* Serdecznie ZAPRASZAMY - napis "wyplywa" z ciemnosci */
  .zaproszenie {
    font-size: clamp(34px, 6.4vw, 92px);
    background: linear-gradient(90deg, #14143a, #3636d8);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }

  /* Link do Discorda */
  .discord {
    display: inline-block;
    padding: 14px 34px;
    font-size: clamp(22px, 3.2vw, 40px);
    color: #7a4dff;
    border: 3px solid #7a4dff;
    text-decoration: none;
    transition: background .2s, transform .15s;
  }
  .discord:hover { background: rgba(122, 77, 255, .15); transform: scale(1.04); }
  .discord:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
</style>
</head>
<body>
  <main>
    <div>
      <h1 class="nazwa">GREITERCODE!</h1>
    </div>
    <p class="data">Startujemy 10.11.2026!</p>
    <p class="zaproszenie">Serdecznie<br>ZAPRASZAMY</p>
    <a class="discord" href="https://discord.gg/7KfZcMWw" target="_blank" rel="noopener">Nasz Discord!</a>
  </main>
</body>
</html>
